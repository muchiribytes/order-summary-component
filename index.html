<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Order summary card component for online music and podcast subscriptions.">

  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700;900&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="./style.css">

  <title>Frontend Mentor | Order summary card</title>
</head>

<body class="page-body">

  <main class="order-card-container">
    <article class="card">
      <div class="card__hero">
        <img src="./images/illustration-hero.svg" alt="" class="card__hero-img" width="450" height="220">
      </div>

      <div class="card__content">
        <h1 class="card__title">Order Summary</h1>

        <p class="card__description">
          You can now listen to millions of songs, audiobooks, and podcasts on any device anywhere you like!
        </p>

        <section class="card__plan-box" aria-label="Selected Subscription Plan">
          <img src="./images/icon-music.svg" alt="" class="card__plan-icon" width="48" height="48">

          <div class="card__plan-details">
            <h2 class="card__plan-name">Annual Plan</h2>
            <p class="card__plan-price">$59.99/year</p>
          </div>

          <a href="#" class="card__plan-change-btn" aria-label="Change annual subscription plan">Change</a>
        </section>

        <div class="card__actions">
          <button type="button" class="btn btn--primary">Proceed to Payment</button>
          <button type="button" class="btn btn--secondary">Cancel Order</button>
        </div>
      </div>
    </article>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank"
      rel="noopener noreferrer">Frontend Mentor</a>.
    Coded by <a href="https://github.com/muchiribytes">Muchiri Bytes</a>.
  </footer>

</body>

</html>
